name: Update media kit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: media-kit-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Restore encrypted Twitch tokens
        uses: actions/cache/restore@v4
        with:
          path: .twitch-state.enc
          key: twitch-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            twitch-tokens-v1-

      - name: Collect Twitch stats
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
        run: node collect.cjs

      - name: Save encrypted Twitch tokens
        if: ${{ always() && hashFiles('.twitch-state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .twitch-state.enc
          key: twitch-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube.cjs

      - name: Collect Instagram stats
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node instagram.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload widget
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish widget
        id: deployment
        uses: actions/deploy-pages@v4
