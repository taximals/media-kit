<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taximals — Twitch Stats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      color: #ffffff;
      font-family: Verdana, sans-serif;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    p {
      color: #dddddd;
      font-size: 12px;
      line-height: 1.6;
    }

    #stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .card {
      min-width: 0;
      background: #2f2f2f;
      border: 1px solid #942e3a;
      border-top: 4px solid #c13545;
      border-radius: 10px;
      padding: 20px;
    }

    .value {
      margin-bottom: 8px;
      font-size: 30px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .label {
      color: #dddddd;
      font-size: 12px;
      line-height: 1.5;
    }

    a {
      color: #ffadb7;
    }

    a:hover {
      color: #ffffff;
    }

    @media (max-width: 420px) {
      .card {
        padding: 14px;
      }

      .value {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>taximals · Twitch</h1>
    <p>Current follower and subscriber totals</p>

    <div id="stats"></div>

    <p id="updated" role="status">Loading stats…</p>

    <p>
      <a
        href="https://www.twitch.tv/taximals"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit my Twitch channel
      </a>
    </p>
  </main>

  <script>
    async function loadStats() {
      const status = document.getElementById("updated");
      const container = document.getElementById("stats");

      try {
        const response = await fetch("data.json", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error("Stats unavailable");
        }

        const data = await response.json();

        if (!Array.isArray(data.stats) || data.stats.length === 0) {
          throw new Error("No stats found");
        }

        const collectedAt = new Date(data.collectedAt);

        if (Number.isNaN(collectedAt.getTime())) {
          throw new Error("Invalid update date");
        }

        const cards = document.createDocumentFragment();

        for (const stat of data.stats) {
          const card = document.createElement("div");
          card.className = "card";

          const value = document.createElement("div");
          value.className = "value";
          value.textContent = stat.value;

          const label = document.createElement("div");
          label.className = "label";
          label.textContent = stat.label;

          card.append(value, label);
          cards.append(card);
        }

        container.replaceChildren(cards);

        const collected = collectedAt.toLocaleString("en-AU", {
          timeZone: "Australia/Brisbane",
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });

        status.textContent =
          "Source: Twitch · Updated: " + collected + " AEST";
      } catch (error) {
        container.replaceChildren();

        status.textContent =
          "Stats are currently unavailable. Please visit my Twitch channel below.";
      }
    }

    loadStats();
  </script>
</body>
</html>
