<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taximals — Audience</title>

  <style>
    :root {
      --panel: #292929;
      --border: #494043;
      --accent: #c13545;
      --text: #ffffff;
      --muted: #c7bcc0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: var(--text);
      font-family: Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 24px;
      margin-bottom: 16px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 12px;
    }

    .total {
      font-size: clamp(32px, 6vw, 46px);
      font-weight: bold;
      line-height: 1.1;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
    }

    .summary-title {
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .summary-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .panel {
      min-width: 0;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
    }

    .handle {
      color: var(--muted);
      font-size: 10px;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .handle:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .handle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.2;
      letter-spacing: -0.8px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .unit {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 16px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .details strong {
      color: var(--text);
      font-weight: bold;
    }

    #status {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    #status:empty {
      display: none;
    }

    @media (max-width: 850px) {
      .panels {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .panels {
        grid-template-columns: 1fr;
      }

      .summary,
      .panel {
        padding: 18px;
      }

      .summary {
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="summary" aria-labelledby="summary-title">
      <div class="total" id="total">—</div>

      <div>
        <h1 class="summary-title" id="summary-title">
          Total followers across platforms
        </h1>

        <p class="summary-note" id="total-note">
          Followers + YouTube subscribers · audiences may overlap
        </p>
      </div>
    </section>

    <div class="panels" id="panels"></div>
    <p id="status" role="status">Loading audience stats…</p>
  </main>

  <script>
    const platforms = [
      {
        id: "twitch",
        title: "Twitch",
        handle: "@taximals",
        url: "https://www.twitch.tv/taximals",
        mainStat: "Twitch followers",
        unit: "followers",
        details: [
          ["Subscribers", "Twitch subscribers"]
        ]
      },
      {
        id: "youtube",
        title: "YouTube",
        handle: "@taximalsvt",
        url: "https://www.youtube.com/@taximalsvt",
        mainStat: "YouTube subscribers",
        unit: "subscribers",
        details: [
          ["Views", "YouTube total views"],
          ["Videos", "YouTube public videos"]
        ]
      },
      {
        id: "instagram",
        title: "Instagram",
        handle: "@taximalsvt",
        url: "https://www.instagram.com/taximalsvt/",
        mainStat: "Instagram followers",
        unit: "followers",
        details: [
          ["Posts", "Instagram posts"]
        ]
      },
      {
        id: "tiktok",
        title: "TikTok",
        handle: "@taximals",
        url: "https://www.tiktok.com/@taximals",
        mainStat: "TikTok followers",
        unit: "followers",
        details: [
          ["Likes", "TikTok total likes"],
          ["Videos", "TikTok public videos"]
        ]
      },
      {
        id: "bluesky",
        title: "Bluesky",
        handle: "@taximals.bsky.social",
        url: "https://bsky.app/profile/taximals.bsky.social",
        mainStat: "Bluesky followers",
        unit: "followers",
        details: [
          ["Posts", "Bluesky posts"],
          ["Following", "Bluesky following"]
        ]
      }
    ];

    async function getJSON(path) {
      const response = await fetch(path, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load " + path);
      }

      return response.json();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);

      if (className) {
        node.className = className;
      }

      if (text !== undefined) {
        node.textContent = text;
      }

      return node;
    }

    // Collectors save whole numbers formatted with commas.
    // Invalid or missing values remain missing rather than becoming zero.
    function parseCount(value) {
      if (typeof value === "number") {
        return Number.isSafeInteger(value) && value >= 0
          ? value
          : null;
      }

      if (typeof value !== "string") {
        return null;
      }

      const cleaned = value.replace(/[,\s]/g, "");

      if (!/^\d+$/.test(cleaned)) {
        return null;
      }

      const count = Number(cleaned);

      return Number.isSafeInteger(count) && count >= 0
        ? count
        : null;
    }

    function formatCount(value) {
      return value === null
        ? "—"
        : value.toLocaleString("en-AU");
    }

    function createPanel(titleText, handle, url, id) {
      const panel = element("section", "panel");
      const heading = element("div", "heading");
      const title = element("h2", "", titleText);

      title.id = id + "-title";
      panel.setAttribute("aria-labelledby", title.id);

      const link = element("a", "handle", handle);
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      heading.append(title, link);
      panel.append(heading);

      return panel;
    }

    function addDetail(container, label, value) {
      const item = element("span");

      item.append(
        document.createTextNode(label + " "),
        element("strong", "", value)
      );

      container.append(item);
    }

    function renderPanel(platform, stats, manual) {
      const panel = createPanel(
        platform.title,
        platform.handle,
        platform.url,
        platform.id
      );

      panel.append(
        element(
          "div",
          "number",
          formatCount(parseCount(stats.get(platform.mainStat)))
        ),
        element("div", "unit", platform.unit)
      );

      const details = element("div", "details");

      for (const [label, key] of platform.details) {
        const value = parseCount(stats.get(key));

        if (value !== null) {
          addDetail(details, label, formatCount(value));
        }
      }

      if (platform.id === "twitch") {
        const average = manual?.averageConcurrentViewers;

        if (
          typeof average === "number" &&
          Number.isFinite(average) &&
          average >= 0
        ) {
          const period =
            typeof manual.period === "string" && manual.period.trim()
              ? manual.period.trim()
              : "period unspecified";

          addDetail(
            details,
            "CCV",
            average.toLocaleString("en-AU", {
              maximumFractionDigits: 2
            })
          );
        }
      }

      if (details.childElementCount) {
        panel.append(details);
      }

      return panel;
    }

    function renderTwitter(manual) {
      const twitter = manual?.twitter;

      const suppliedUsername =
        typeof twitter?.username === "string"
          ? twitter.username.trim().replace(/^@/, "")
          : "";

      const username = /^[A-Za-z0-9_]{1,15}$/.test(suppliedUsername)
        ? suppliedUsername
        : "taximalsVT";

      const panel = createPanel(
        "X / Twitter",
        "@" + username,
        "https://x.com/" + username,
        "twitter"
      );

      panel.append(
        element(
          "div",
          "number",
          formatCount(parseCount(twitter?.followers))
        ),
        element("div", "unit", "followers")
      );

      return panel;
    }

    async function load() {
      const status = document.getElementById("status");
      const container = document.getElementById("panels");

      const [automaticResult, manualResult] =
        await Promise.allSettled([
          getJSON("data.json"),
          getJSON("manual.json")
        ]);

      const data =
        automaticResult.status === "fulfilled" &&
        Array.isArray(automaticResult.value?.stats)
          ? automaticResult.value
          : { stats: [] };

      const manual =
        manualResult.status === "fulfilled"
          ? manualResult.value
          : null;

      const stats = new Map();

      for (const stat of data.stats) {
        if (stat && typeof stat.label === "string") {
          stats.set(stat.label, stat.value);
        }
      }

      const panels = platforms.map(platform =>
        renderPanel(platform, stats, manual)
      );

      panels.push(renderTwitter(manual));
      container.replaceChildren(...panels);

      // Add one audience count per platform.
      // Twitch paid subscribers are not included in this sum.
      const audienceCounts = platforms.map(platform =>
        parseCount(stats.get(platform.mainStat))
      );

      audienceCounts.push(
        parseCount(manual?.twitter?.followers)
      );

      const available = audienceCounts.filter(
        value => value !== null
      );

      const complete = available.length === audienceCounts.length;

      const total = available.reduce(
        (sum, count) => sum + count,
        0
      );

      document.getElementById("total").textContent =
        available.length ? total.toLocaleString("en-AU") : "—";

      document.getElementById("summary-title").textContent =
        complete
          ? "Total followers across platforms"
          : "Followers across available platforms";

      document.getElementById("total-note").textContent =
        available.length +
        " of 6 platforms · includes YouTube subscribers · audiences may overlap";

      status.textContent = complete
        ? ""
        : "Some follower counts are missing. The total includes available values only.";
    }

    load().catch(() => {
      document.getElementById("status").textContent =
        "Unable to display audience stats. Please try again later.";
    });
  </script>
</body>
</html>
