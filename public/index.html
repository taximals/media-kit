<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taximals — Media Kit Stats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      color: #ffffff;
      font-family: Verdana, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .panel {
      min-width: 0;
      padding: 20px;
      background: #2f2f2f;
      border: 1px solid #942e3a;
      border-left: 5px solid #c13545;
      border-radius: 14px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      font-size: 14px;
    }

    a {
      color: #ffadb7;
      font-size: 11px;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .unit {
      margin-top: 4px;
      color: #dddddd;
      font-size: 12px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      color: #dddddd;
      font-size: 11px;
      line-height: 1.7;
    }

    .details strong {
      color: #ffffff;
    }

    .note {
      margin: 12px 0 0;
      color: #cccccc;
      font-size: 10px;
      line-height: 1.6;
    }

    #status {
      margin: 12px 0 0;
      color: #dddddd;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .panels {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="panels" id="panels"></div>
    <p id="status" role="status">Loading stats…</p>
  </main>

  <script>
    const platforms = [
      {
        id: "twitch",
        title: "Twitch",
        handle: "@taximals",
        url: "https://www.twitch.tv/taximals",
        mainStat: "Twitch followers",
        unit: "followers",
        details: [
          ["Subscribers", "Twitch subscribers"]
        ],
        timestamp: "collectedAt",
        source: "Twitch API"
      },
      {
        id: "youtube",
        title: "YouTube",
        handle: "@taximalsvt",
        url: "https://www.youtube.com/@taximalsvt",
        mainStat: "YouTube subscribers",
        unit: "subscribers",
        details: [
          ["Total views", "YouTube total views"],
          ["Public videos", "YouTube public videos"]
        ],
        timestamp: "youtubeCollectedAt",
        source: "YouTube Data API",
        note: "Subscriber count rounded by YouTube."
      },
      {
        id: "instagram",
        title: "Instagram",
        handle: "@taximalsvt",
        url: "https://www.instagram.com/taximalsvt/",
        mainStat: "Instagram followers",
        unit: "followers",
        details: [
          ["Posts", "Instagram posts"]
        ],
        timestamp: "instagramCollectedAt",
        source: "Instagram API"
      },
      {
        id: "tiktok",
        title: "TikTok",
        handle: "@taximals",
        url: "https://www.tiktok.com/@taximals",
        mainStat: "TikTok followers",
        unit: "followers",
        details: [
          ["Total likes", "TikTok total likes"],
          ["Public videos", "TikTok public videos"]
        ],
        timestamp: "tiktokCollectedAt",
        source: "TikTok API"
      },
      {
        id: "bluesky",
        title: "Bluesky",
        handle: "@taximals.bsky.social",
        url: "https://bsky.app/profile/taximals.bsky.social",
        mainStat: "Bluesky followers",
        unit: "followers",
        details: [
          ["Posts", "Bluesky posts"],
          ["Following", "Bluesky following"]
        ],
        timestamp: "blueskyCollectedAt",
        source: "Bluesky API"
      }
    ];

    async function getJSON(path) {
      const response = await fetch(path, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load " + path);
      }

      return response.json();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);

      if (className) {
        node.className = className;
      }

      if (text !== undefined) {
        node.textContent = text;
      }

      return node;
    }

    function addDetail(container, label, value) {
      const item = element("span");

      item.append(
        document.createTextNode(label + " "),
        element("strong", "", value)
      );

      container.append(item);
    }

    function updateText(timestamp, source) {
      const date = timestamp ? new Date(timestamp) : null;

      if (!date || Number.isNaN(date.getTime())) {
        return "Source: " + source;
      }

      const formatted = date.toLocaleString("en-AU", {
        timeZone: "Australia/Brisbane",
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });

      return source + " · Updated " + formatted + " AEST";
    }

    function renderPanel(platform, data, stats, manual) {
      const panel = element("section", "panel");
      const heading = element("div", "heading");

      const title = element("h2", "", platform.title);
      title.id = platform.id + "-title";
      panel.setAttribute("aria-labelledby", title.id);

      const link = element("a", "", platform.handle);
      link.href = platform.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      heading.append(title, link);

      panel.append(
        heading,
        element(
          "div",
          "number",
          stats.get(platform.mainStat) ?? "—"
        ),
        element("div", "unit", platform.unit)
      );

      const details = element("div", "details");

      for (const [label, key] of platform.details) {
        if (stats.has(key)) {
          addDetail(details, label, stats.get(key));
        }
      }

      let manualNote;

      if (platform.id === "twitch" && manual) {
        const average = manual.averageConcurrentViewers;

        if (
          typeof average === "number" &&
          Number.isFinite(average) &&
          average >= 0
        ) {
          addDetail(
            details,
            "Avg concurrent viewers",
            average.toLocaleString("en-AU", {
              maximumFractionDigits: 2
            })
          );

          const notes = [
            "Average: " + (manual.period || "period not specified"),
            "manually entered"
          ];

          if (manual.updated) {
            notes.push("checked " + manual.updated);
          }

          manualNote = notes.join(" · ");
        }
      }

      if (details.childElementCount) {
        panel.append(details);
      }

      if (manualNote) {
        panel.append(element("p", "note", manualNote));
      }

      if (platform.note) {
        panel.append(element("p", "note", platform.note));
      }

      panel.append(
        element(
          "p",
          "note",
          updateText(data[platform.timestamp], platform.source)
        )
      );

      return panel;
    }

    async function load() {
      const status = document.getElementById("status");
      const container = document.getElementById("panels");

      const [automaticResult, manualResult] =
        await Promise.allSettled([
          getJSON("data.json"),
          getJSON("manual.json")
        ]);

      let data = { stats: [] };
      let automaticAvailable = false;

      if (
        automaticResult.status === "fulfilled" &&
        Array.isArray(automaticResult.value?.stats)
      ) {
        data = automaticResult.value;
        automaticAvailable = true;
      }

      const manual =
        manualResult.status === "fulfilled"
          ? manualResult.value
          : null;

      const stats = new Map();

      for (const stat of data.stats) {
        if (
          stat &&
          typeof stat.label === "string" &&
          stat.value != null
        ) {
          stats.set(stat.label, stat.value);
        }
      }

      const panels = platforms.map(platform =>
        renderPanel(platform, data, stats, manual)
      );

      container.replaceChildren(...panels);

      if (!automaticAvailable) {
        status.textContent =
          "Automatic stats are currently unavailable.";
      } else if (
        platforms.some(platform => !stats.has(platform.mainStat))
      ) {
        status.textContent =
          "Some stats are unavailable. Missing values appear as —.";
      } else {
        status.textContent = "";
      }
    }

    load().catch(() => {
      document.getElementById("status").textContent =
        "Unable to display stats. Please try again later.";
    });
  </script>
</body>
</html>
