<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taximals — Audience</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --border: #942E3A;
      --text: #ffffff;
      --muted: #d3c9cc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: transparent;
    }

    body {
      margin: 0;
      padding: 4px;
      color: var(--text);
      font-family: "Comfortaa", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .summary {
      margin-bottom: 10px;
      padding: 15px 10px;
      border: 3px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }

    .total {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.7px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .summary-title {
      margin: 7px 0 0;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      padding: 12px 10px;
      border: 3px solid var(--border);
      border-radius: 10px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;
    }

    .number {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .unit {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
    }

    .detail {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 3px 5px;
    }

    .detail strong {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    #status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    #status:empty {
      display: none;
    }

    @media (min-width: 720px) {
      .panels {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .panel {
        padding: 14px;
      }

      .details {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 5px 12px;
      }
    }

    @media (max-width: 260px) {
      .panels {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="summary" aria-labelledby="summary-title">
      <div class="total" id="total">—</div>
      <h1 class="summary-title" id="summary-title">
        Total followers across platforms
      </h1>
    </section>

    <div class="panels" id="panels"></div>
    <p id="status" role="status">Loading audience stats…</p>
  </main>

  <script>
    const platforms = [
      {
        id: "twitch",
        title: "Twitch",
        mainStat: "Twitch followers",
        unit: "followers",
        details: [
          ["Subscribers", "Twitch subscribers"]
        ]
      },
      {
        id: "youtube",
        title: "YouTube",
        mainStat: "YouTube subscribers",
        unit: "subscribers",
        details: [
          ["Views", "YouTube total views"],
          ["Videos", "YouTube public videos"]
        ]
      },
      {
        id: "instagram",
        title: "Instagram",
        mainStat: "Instagram followers",
        unit: "followers",
        details: [
          ["Posts", "Instagram posts"]
        ]
      },
      {
        id: "tiktok",
        title: "TikTok",
        mainStat: "TikTok followers",
        unit: "followers",
        details: [
          ["Likes", "TikTok total likes"],
          ["Videos", "TikTok public videos"]
        ]
      },
      {
        id: "bluesky",
        title: "Bluesky",
        mainStat: "Bluesky followers",
        unit: "followers",
        details: []
      }
    ];

    async function getJSON(path) {
      const response = await fetch(path, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load " + path);
      }

      return response.json();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);

      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;

      return node;
    }

    function parseCount(value) {
      if (typeof value === "number") {
        return Number.isSafeInteger(value) && value >= 0
          ? value
          : null;
      }

      if (typeof value !== "string") return null;

      const cleaned = value.replace(/[,\s]/g, "");
      if (!/^\d+$/.test(cleaned)) return null;

      const count = Number(cleaned);

      return Number.isSafeInteger(count) && count >= 0
        ? count
        : null;
    }

    function formatCount(value) {
      return value === null
        ? "—"
        : value.toLocaleString("en-AU");
    }

    function createPanel(titleText, id) {
      const panel = element("section", "panel");
      const title = element("h2", "", titleText);

      title.id = id + "-title";
      panel.setAttribute("aria-labelledby", title.id);
      panel.append(title);

      return panel;
    }

    function addDetail(container, label, value) {
      const item = element("span", "detail");

      item.append(
        element("span", "", label),
        element("strong", "", value)
      );

      container.append(item);
    }

    function renderPanel(platform, stats, manual) {
      const panel = createPanel(platform.title, platform.id);

      panel.append(
        element(
          "div",
          "number",
          formatCount(parseCount(stats.get(platform.mainStat)))
        ),
        element("div", "unit", platform.unit)
      );

      const details = element("div", "details");

      for (const [label, key] of platform.details) {
        const value = parseCount(stats.get(key));

        if (value !== null) {
          addDetail(details, label, formatCount(value));
        }
      }

      if (platform.id === "twitch") {
        const average = manual?.averageConcurrentViewers;

        if (
          typeof average === "number" &&
          Number.isFinite(average) &&
          average >= 0
        ) {
          addDetail(
            details,
            "CCV",
            average.toLocaleString("en-AU", {
              maximumFractionDigits: 2
            })
          );
        }
      }

      if (details.childElementCount) panel.append(details);

      return panel;
    }

    function renderTwitter(manual) {
      const panel = createPanel("X / Twitter", "twitter");

      panel.append(
        element(
          "div",
          "number",
          formatCount(parseCount(manual?.twitter?.followers))
        ),
        element("div", "unit", "followers")
      );

      return panel;
    }

    async function load() {
      const status = document.getElementById("status");
      const container = document.getElementById("panels");

      const [automaticResult, manualResult] =
        await Promise.allSettled([
          getJSON("data.json"),
          getJSON("manual.json")
        ]);

      const data =
        automaticResult.status === "fulfilled" &&
        Array.isArray(automaticResult.value?.stats)
          ? automaticResult.value
          : { stats: [] };

      const manual =
        manualResult.status === "fulfilled"
          ? manualResult.value
          : null;

      const stats = new Map();

      for (const stat of data.stats) {
        if (stat && typeof stat.label === "string") {
          stats.set(stat.label, stat.value);
        }
      }

      const panels = platforms.map(platform =>
        renderPanel(platform, stats, manual)
      );

      panels.push(renderTwitter(manual));
      container.replaceChildren(...panels);

      // Add one audience count per platform.
      // YouTube subscribers are included.
      // Twitch paid subscribers are not added separately.
      const audienceCounts = platforms.map(platform =>
        parseCount(stats.get(platform.mainStat))
      );

      audienceCounts.push(
        parseCount(manual?.twitter?.followers)
      );

      const complete = audienceCounts.every(
        value => value !== null
      );

      document.getElementById("total").textContent = complete
        ? audienceCounts.reduce(
            (sum, count) => sum + count,
            0
          ).toLocaleString("en-AU")
        : "—";

      status.textContent = complete
        ? ""
        : "Some follower counts are unavailable. The total will appear when all counts are loaded.";
    }

    load().catch(() => {
      document.getElementById("status").textContent =
        "Unable to display audience stats. Please try again later.";
    });
  </script>

  <script>
    (() => {
      const main = document.querySelector("main");
      if (!main) return;

      let lastHeight = 0;

      function reportHeight(force = false) {
        const style = getComputedStyle(document.body);

        const height = Math.ceil(
          main.getBoundingClientRect().height +
          (parseFloat(style.paddingTop) || 0) +
          (parseFloat(style.paddingBottom) || 0)
        );

        if (height < 1) return;
        if (!force && height === lastHeight) return;

        lastHeight = height;

        window.parent.postMessage(
          {
            type: "taximals-widget-height",
            height: height
          },
          "*"
        );
      }

      if (window.ResizeObserver) {
        new ResizeObserver(() => reportHeight()).observe(main);
      }

      window.addEventListener("resize", () => reportHeight());
      window.addEventListener("load", () => reportHeight(true));
      window.addEventListener("pageshow", () => reportHeight(true));

      window.addEventListener("message", event => {
        if (
          event.source === window.parent &&
          event.data?.type === "taximals-request-height"
        ) {
          reportHeight(true);
        }
      });

      if (document.fonts?.ready) {
        document.fonts.ready.then(() => reportHeight(true));
      }

      reportHeight(true);
    })();
  </script>
</body>
</html>
